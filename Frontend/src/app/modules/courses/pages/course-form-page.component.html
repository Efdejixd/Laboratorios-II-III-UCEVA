<a routerLink="/courses" class="text-decoration-none">← Volver a cursos</a>
        <h1 class="h2 page-title my-3">{{ editId === null ? 'Crear curso' : 'Editar curso' }}</h1>
        <div class="card shadow-sm"><div class="card-body p-4">
          <div class="alert alert-danger" role="alert" *ngIf="errorMessage">{{ errorMessage }}</div>
          <p class="text-secondary" *ngIf="loading" role="status">Cargando registro...</p>
          <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading && !recordNotFound" novalidate>
<div class="mb-3">
  <label class="form-label" for="name">Nombre</label>
  <input id="name" class="form-control" type="text" formControlName="name" maxlength="100" [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched">
  <div class="invalid-feedback">Verifica el campo nombre.</div>
</div>
<div class="mb-3">
  <label class="form-label" for="description">Descripción</label>
  <textarea id="description" class="form-control" rows="3" formControlName="description" [class.is-invalid]="form.get('description')?.invalid && form.get('description')?.touched"></textarea>
  <div class="invalid-feedback">Verifica el campo descripción.</div>
</div>
<div class="mb-3">
  <label class="form-label" for="credits">Créditos</label>
  <input id="credits" class="form-control" type="number" formControlName="credits" min="1" max="10" step="1" [class.is-invalid]="form.get('credits')?.invalid && form.get('credits')?.touched">
  <div class="invalid-feedback">Verifica el campo créditos.</div>
</div>
<div class="mb-3">
  <label class="form-label" for="semester">Semestre</label>
  <input id="semester" class="form-control" type="number" formControlName="semester" min="1" max="10" step="1" [class.is-invalid]="form.get('semester')?.invalid && form.get('semester')?.touched">
  <div class="invalid-feedback">Verifica el campo semestre.</div>
</div>
<div class="form-check form-switch mb-4">
  <input id="status" class="form-check-input" type="checkbox" formControlName="status">
  <label for="status" class="form-check-label">Registro activo</label>
</div>
            <div class="d-flex gap-2 flex-wrap">
              <button type="submit" class="btn btn-primary" [disabled]="saving || form.invalid">{{ saving ? 'Guardando...' : (editId === null ? 'Crear' : 'Guardar cambios') }}</button>
              <a routerLink="/courses" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div></div>

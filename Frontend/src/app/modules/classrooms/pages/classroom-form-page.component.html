    <a routerLink="/classrooms" class="text-decoration-none">← Volver a salones</a>
    <h1 class="h2 page-title my-3">{{ editId === null ? 'Crear salón' : 'Editar salón' }}</h1>
    <div class="card shadow-sm"><div class="card-body p-4">
      <div class="alert alert-danger" role="alert" *ngIf="errorMessage">{{ errorMessage }}</div>
      <p class="text-secondary" *ngIf="loading" role="status">Cargando registro...</p>
      <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!loading && !recordNotFound" novalidate>
        <div class="mb-3">
               <label class="form-label" for="name">Nombre</label>
               <input id="name" class="form-control" [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched" type="text" maxlength="100" formControlName="name">
               <div class="invalid-feedback">Verifica el campo nombre.</div>
              </div>
<div class="mb-3">
               <label class="form-label" for="building">Edificio</label>
               <input id="building" class="form-control" [class.is-invalid]="form.get('building')?.invalid && form.get('building')?.touched" type="text" maxlength="100" formControlName="building">
               <div class="invalid-feedback">Verifica el campo edificio.</div>
              </div>
<div class="mb-3">
               <label class="form-label" for="capacity">Capacidad</label>
               <input id="capacity" class="form-control" [class.is-invalid]="form.get('capacity')?.invalid && form.get('capacity')?.touched" type="number" min="1" max="300" step="1" formControlName="capacity">
               <div class="invalid-feedback">Verifica el campo capacidad.</div>
              </div>
<div class="form-check form-switch mb-4">
                <input id="status" class="form-check-input" type="checkbox" formControlName="status">
                <label for="status" class="form-check-label">Registro activo</label>
              </div>
        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-primary" [disabled]="saving || form.invalid">{{ saving ? 'Guardando...' : (editId === null ? 'Crear' : 'Guardar cambios') }}</button>
          <a routerLink="/classrooms" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div></div>
